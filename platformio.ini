; Flight Panel — Adafruit MatrixPortal S3 + HUB75 64x32 P5 panel
; Build:  pio run            Flash over USB:  pio run -e usb -t upload
; Flash over Wi-Fi (OTA):  pio run -e ota -t upload

[env]
platform = espressif32@6.9.0
board = adafruit_matrixportal_esp32s3
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.12
    adafruit/Adafruit GFX Library@1.11.11
    bblanchon/ArduinoJson@7.2.1
    tzapu/WiFiManager@2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    ; protect OTA updates with a password (then also add  upload_flags = --auth=...  to [env:ota]):
    ; -DOTA_PASSWORD=\"change-me\"

[env:usb]
upload_port = COM3
monitor_port = COM3

[env:ota]
upload_protocol = espota
upload_port = flightpanel.local
